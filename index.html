<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikSave - TikTok Downloader Tanpa Watermark</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #E0E0E0; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px; height: 36px; border-radius: 50%;
            border-left-color: #00F2FE; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-gray-800 bg-[#1e1e1e] sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-gradient-to-r from-cyan-400 to-pink-500 text-black font-bold px-2.5 py-1 rounded-lg text-lg">🎵</div>
                <h1 class="text-xl font-bold tracking-tight text-white">Tik<span class="text-cyan-400">Save</span></h1>
            </div>
            <span class="text-xs bg-cyan-950 text-cyan-300 font-medium px-2.5 py-1 rounded-full border border-cyan-800/50">No Watermark</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto w-full px-4 py-6 flex-grow flex flex-col gap-6">

        <!-- Input URL Section -->
        <section class="bg-[#1e1e1e] p-5 rounded-2xl border border-gray-800 shadow-xl flex flex-col gap-3">
            <label class="block text-xs font-semibold uppercase text-gray-400 tracking-wider">Tempel Link TikTok Kamu</label>
            <div class="flex flex-col gap-2">
                <input type="url" id="tiktok-url" placeholder="https://www.tiktok.com/@user/video/..." class="w-full px-4 py-3 rounded-xl bg-[#171717] border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 text-sm transition">
                <button id="btn-fetch" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-cyan-900/30 active:scale-[0.98]">
                    Cari Video
                </button>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loading-state" class="hidden flex flex-col items-center justify-center py-6 gap-3">
            <div class="spinner"></div>
            <p class="text-sm font-medium text-cyan-400 animate-pulse">Mengambil Video Tanpa Watermark...</p>
        </div>

        <!-- Result Section -->
        <section id="result-section" class="bg-[#1e1e1e] p-5 rounded-2xl border border-gray-800 shadow-xl flex flex-col gap-4 hidden">
            
            <div class="flex items-center gap-3 border-b border-gray-800 pb-3">
                <img id="author-avatar" class="w-10 h-10 rounded-full border border-cyan-500 object-cover" src="" alt="Avatar">
                <div class="overflow-hidden">
                    <p id="author-nickname" class="text-sm font-bold text-white truncate"></p>
                    <p id="video-title" class="text-xs text-gray-400 truncate"></p>
                </div>
            </div>

            <!-- Video Player Preview -->
            <div class="bg-[#171717] p-2 rounded-xl border border-gray-800 flex justify-center">
                <video id="video-player" controls class="max-h-[380px] rounded-lg w-auto object-contain"></video>
            </div>

            <!-- Download Buttons -->
            <div class="flex flex-col gap-2 pt-2">
                <button id="btn-download-video" class="w-full py-3 text-center bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-xl text-sm transition shadow-md active:scale-[0.98]">
                    ⬇️ Unduh Video (No Watermark)
                </button>
                <button id="btn-download-audio" class="w-full py-3 text-center bg-gray-800 hover:bg-gray-700 text-cyan-300 font-semibold rounded-xl text-sm border border-gray-700 transition active:scale-[0.98]">
                    🎵 Unduh Audio / MP3 Saja
                </button>
            </div>
        </section>

        <!-- Donation Placeholder -->
        <section class="bg-[#1e1e1e] p-4 rounded-xl border border-gray-800/80 text-center flex flex-col gap-2">
            <p class="text-xs text-gray-400">Website ini gratis & tanpa iklan!</p>
            <div class="flex justify-center items-center gap-2">
                <a href="https://trakteer.id" target="_blank" rel="noopener" class="text-xs text-cyan-400 hover:underline font-medium">Trakteer ☕</a>
                <span class="text-gray-600">•</span>
                <a href="https://saweria.co" target="_blank" rel="noopener" class="text-xs text-amber-400 hover:underline font-medium">Saweria 💛</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-gray-600 border-t border-gray-800">
        &copy; 2026 TikSave. Fast TikTok Video Downloader.
    </footer>

    <!-- Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnFetch = document.getElementById('btn-fetch');
            const tiktokUrlInput = document.getElementById('tiktok-url');
            const loadingState = document.getElementById('loading-state');
            const resultSection = document.getElementById('result-section');
            
            const authorAvatar = document.getElementById('author-avatar');
            const authorNickname = document.getElementById('author-nickname');
            const videoTitle = document.getElementById('video-title');
            const videoPlayer = document.getElementById('video-player');
            
            const btnDownloadVideo = document.getElementById('btn-download-video');
            const btnDownloadAudio = document.getElementById('btn-download-audio');

            let directVideoUrl = '';
            let directAudioUrl = '';

            btnFetch.addEventListener('click', async () => {
                const url = tiktokUrlInput.value.trim();
                if (!url) {
                    alert('Masukkan link video TikTok terlebih dahulu!');
                    return;
                }

                resultSection.classList.add('hidden');
                loadingState.classList.remove('hidden');

                try {
                    const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    loadingState.classList.add('hidden');

                    if (data && data.code === 0) {
                        const videoData = data.data;

                        authorAvatar.src = videoData.author.avatar || '';
                        authorNickname.innerText = videoData.author.nickname || 'TikTok User';
                        videoTitle.innerText = videoData.title || 'Video TikTok';
                        
                        videoPlayer.src = videoData.play;
                        directVideoUrl = videoData.play;
                        directAudioUrl = videoData.music;

                        resultSection.classList.remove('hidden');
                    } else {
                        alert('Gagal mengambil video. Pastikan link video TikTok valid dan akun tidak diprivat.');
                    }
                } catch (error) {
                    console.error(error);
                    loadingState.classList.add('hidden');
                    alert('Terjadi kesalahan jaringan. Silakan coba lagi.');
                }
            });

            // Fungsi Paksa Unduh File via Blob (Mencegah buka tab baru/play video)
            async function downloadFile(fileUrl, filename) {
                if (!fileUrl) return;
                try {
                    btnDownloadVideo.innerText = "Mengunduh...";
                    const response = await fetch(fileUrl);
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                    btnDownloadVideo.innerText = "⬇️ Unduh Video (No Watermark)";
                } catch (e) {
                    console.error(e);
                    // Fallback jika diblokir CORS oleh browser
                    window.open(fileUrl, '_blank');
                    btnDownloadVideo.innerText = "⬇️ Unduh Video (No Watermark)";
                }
            }

            btnDownloadVideo.addEventListener('click', () => {
                downloadFile(directVideoUrl, 'TikTok_NoWatermark_TikSave.mp4');
            });

            btnDownloadAudio.addEventListener('click', () => {
                downloadFile(directAudioUrl, 'TikTok_Audio_TikSave.mp3');
            });
        });
    </script>
</body>
</html>
